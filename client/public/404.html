<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scoring Heroes</title>
    <script>
      // Single Page Application SPA Redirect fallback
      (function () {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        window.location.replace('/' + (path && path !== '/' ? '?p=' + encodeURIComponent(path + search + hash) : ''));
      })();
    </script>
    <style>
      body {
        margin: 0;
        background: #020617;
        color: #f8fafc;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .loader {
        text-align: center;
      }
      .spinner {
        width: 36px;
        height: 36px;
        margin: 0 auto 16px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #1d6dff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="loader">
      <div class="spinner"></div>
      <p style="font-size: 14px; color: #94a3b8; margin: 0;">Loading Scoring Heroes...</p>
    </div>
  </body>
</html>
